[package]
name = "gold-signal-bot"
version = "0.1.0"
edition = "2021"
authors = ["Senior Systems Architect <trader@goldsignal.io>"]
description = "High-performance automated XAU/USD trading signal engine with dynamic S/R detection, volume absorption filter, and Telegram notifications."

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros", "json"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time & Utilities
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"

# Tracing & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
