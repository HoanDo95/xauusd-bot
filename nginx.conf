limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

# Sensitive dashboard/API responses must not be cached. Hashed static assets
# can stay immutable; they contain no runtime data.
map $uri $cache_control {
    default "no-store, no-cache, must-revalidate, private";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/_next/static/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256k;

    # Generated at container start: empty when DASHBOARD_USER/PASSWORD are unset.
    include /etc/nginx/auth.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control $cache_control always;

    # Clear any previously cached dashboard HTML when auth fails, so the
    # browser cannot show stale account data behind the Basic auth dialog.
    # Scoped to the SPA location so API/webhook 401 JSON bodies are preserved.
    location @unauthorized {
        auth_basic off;
        add_header WWW-Authenticate 'Basic realm="Gold Signal Bot"' always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Clear-Site-Data '"cache"' always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        return 401;
    }

    # Container-level liveness: does not depend on the API container.
    location = /healthz {
        access_log off;
        auth_basic off;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Public health alias used by the dashboard / smoke tests.
    location = /health {
        auth_basic off;
        add_header Cache-Control "no-store" always;
        proxy_pass http://api:8090/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TradingView/webhook endpoints cannot send Basic auth; they use the
    # webhook passphrase instead. Keep them outside the dashboard auth gate.
    location ~ ^/api/(webhook(?:/tradingview)?|candles/webhook)$ {
        auth_basic off;
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Single-origin API: dashboard calls /api/*, Nginx forwards to Rust Axum.
    location /api/ {
        error_page 401 = @unauthorized;
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Next.js content-hashed static assets.
    location /_next/static/ {
        try_files $uri =404;
    }

    # SPA fallback (client-side routes).
    location / {
        error_page 401 = @unauthorized;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
