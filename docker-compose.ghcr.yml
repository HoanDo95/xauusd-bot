# Pull-only overlay for the deploy server. Build happens in GitHub Actions.
# Usage:
#   TAG=<commit-sha> docker compose \
#     -f docker-compose.yml -f docker-compose.ghcr.yml pull
#   TAG=<commit-sha> docker compose \
#     -f docker-compose.yml -f docker-compose.ghcr.yml up -d
services:
  api:
    image: ghcr.io/hoando95/xauusd-bot-api:${TAG:-main}
    build: !reset null
    pull_policy: always

  web:
    image: ghcr.io/hoando95/xauusd-bot-web:${TAG:-main}
    build: !reset null
    pull_policy: always
