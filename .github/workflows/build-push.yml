name: build-push

# Build API + dashboard images on the self-hosted runner and push to GHCR.
# The deploy server pulls images; it never compiles on the deploy step.
# Triggered after CI is green (same pattern as edgepool).

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-push-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names.
  OWNER_LC: hoando95
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # Self-hosted: no GitHub-hosted minutes, no billing block.
    runs-on: [self-hosted, xauusd-bot]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login GHCR
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build + push Rust API
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER_LC}/xauusd-bot-api"
          docker build \
            -f rust-backend/Dockerfile \
            -t "${IMAGE}:main" \
            -t "${IMAGE}:${SHA}" \
            rust-backend
          docker push "${IMAGE}:main"
          docker push "${IMAGE}:${SHA}"

      - name: Build + push dashboard
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER_LC}/xauusd-bot-web"
          docker build \
            -f Dockerfile.web \
            -t "${IMAGE}:main" \
            -t "${IMAGE}:${SHA}" \
            .
          docker push "${IMAGE}:main"
          docker push "${IMAGE}:${SHA}"

      - name: Summary
        run: |
          echo "## GHCR images" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/${OWNER_LC}/xauusd-bot-api:main + :${SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/${OWNER_LC}/xauusd-bot-web:main + :${SHA}" >> "$GITHUB_STEP_SUMMARY"
