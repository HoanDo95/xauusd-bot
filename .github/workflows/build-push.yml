name: build-push

# Cloud build (GitHub-hosted): build API + dashboard images and push to GHCR.
# The deploy server only pulls images; it never compiles Rust or runs npm build.
# Triggered after CI is green (same pattern as edgepool).

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-push-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names. Update if the repo owner differs.
  OWNER_LC: hoando95

jobs:
  images:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push Rust API
        uses: docker/build-push-action@v6
        with:
          context: rust-backend
          file: rust-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/xauusd-bot-api:main
            ghcr.io/${{ env.OWNER_LC }}/xauusd-bot-api:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=xauusd-api
          cache-to: type=gha,scope=xauusd-api,mode=max

      - name: Build + push dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/xauusd-bot-web:main
            ghcr.io/${{ env.OWNER_LC }}/xauusd-bot-web:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=xauusd-web
          cache-to: type=gha,scope=xauusd-web,mode=max

      - name: Summary
        run: |
          echo "## GHCR images" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/${OWNER_LC}/xauusd-bot-api:main + :${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/${OWNER_LC}/xauusd-bot-web:main + :${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
