name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt + clippy + tests)
    # Self-hosted to avoid GitHub-hosted billing/minutes restrictions.
    runs-on: [self-hosted, xauusd-bot]
    defaults:
      run:
        working-directory: rust-backend
    steps:
      - uses: actions/checkout@v4

      - name: Add Rust toolchain to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Toolchain check
        run: |
          cargo --version
          rustc --version
          cargo fmt --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend

      - name: Format check
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked

  web:
    name: Web (lint + build)
    runs-on: [self-hosted, xauusd-bot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node --version
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
