name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

# The self-hosted runner has Docker access and can read the deploy directory.
# Never run untrusted pull-request code on it; use a hosted runner for PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared 15 GB host: keep build parallelism and Node heap bounded.
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  NODE_OPTIONS: "--max-old-space-size=2048"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  rust:
    name: Rust (fmt + clippy + tests)
    # Self-hosted to avoid GitHub-hosted billing/minutes restrictions.
    runs-on: [self-hosted, xauusd-bot]
    defaults:
      run:
        working-directory: rust-backend
    steps:
      - uses: actions/checkout@v4

      - name: Add Rust toolchain to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Toolchain check
        run: |
          cargo --version
          rustc --version
          cargo fmt --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend

      - name: Format check
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked

  web:
    name: Web (lint + build)
    runs-on: [self-hosted, xauusd-bot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node --version
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # Static export is the production artifact. The optional server-mode
      # `npm run build` can be run locally when needed; it doubles build memory.
      - run: npm run build:static
